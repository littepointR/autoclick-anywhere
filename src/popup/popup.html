<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoClick Anywhere</title>
  <link rel="stylesheet" href="./popup.css" />
</head>
<body>
  <div class="popup-root">
    <header class="header">
      <div class="title-wrap">
        <span class="dot" id="status-dot"></span>
        <div>
          <h1>AutoClick Anywhere</h1>
          <p class="subtitle">DOM + Canvas/WebGL 流程图自动点击器</p>
        </div>
      </div>
      <span class="pill" id="status-badge">检测中…</span>
    </header>

    <section class="card">
      <button class="btn btn-primary btn-block" id="btn-toggle-hud">🎛️ 在当前网页显示悬浮面板 (Alt+H)</button>
      <div class="grid-2">
        <button class="btn btn-accent" id="btn-pause-resume">▶ 启动 / 暂停 (F8)</button>
        <button class="btn btn-danger" id="btn-stop" disabled>⏹ 停止 (Esc)</button>
      </div>
      <div class="grid-2">
        <button class="btn btn-record" id="btn-toggle-record">🔴 录制宏转流程 (F9)</button>
        <button class="btn" id="btn-toggle-pins">👁️ 显隐目标点 (Alt+P)</button>
      </div>
    </section>

    <section class="card">
      <div class="card-label">输入派发引擎</div>
      <div class="engine-options">
        <label class="radio-card">
          <input type="radio" name="engine" value="cdp" id="eng-cdp" />
          <div>
            <strong>⚡ CDP 原生可信引擎（推荐）</strong>
            <small>通过 Chrome Debugger 派发硬件级输入（isTrusted=true），稳定穿透 Canvas / WebGL / Shadow DOM</small>
          </div>
        </label>
        <label class="radio-card">
          <input type="radio" name="engine" value="dom" id="eng-dom" />
          <div>
            <strong>🔇 DOM 静默合成引擎</strong>
            <small>零调试横幅，支持 DOM 选择器追踪、Canvas 比例映射与本地滚动</small>
          </div>
        </label>
      </div>
    </section>

    <section class="card">
      <div class="card-label">辅助选项</div>
      <label class="toggle-row">
        <span>显示点击 / 滚轮 / 拖拽波纹特效</span>
        <input type="checkbox" id="opt-ripples" />
      </label>
      <label class="toggle-row">
        <span>显示页面目标点位标记 (Pins)</span>
        <input type="checkbox" id="opt-pins" />
      </label>
      <label class="toggle-row">
        <span>按 Esc 键紧急停止执行/录制</span>
        <input type="checkbox" id="opt-esc" />
      </label>
      <label class="toggle-row">
        <span>停止/暂停后自动断开 CDP 调试横幅</span>
        <input type="checkbox" id="opt-detach" />
      </label>
    </section>

    <footer class="footer">
      <button class="btn btn-outline btn-block" id="btn-open-playground">🧪 打开 DOM + Canvas + WebGL 测试靶场</button>
      <div class="hint" id="conn-hint">默认仅在点击开启的当前网页显示悬浮面板</div>
    </footer>
  </div>
  <script src="./popup.js"></script>
</body>
</html>
