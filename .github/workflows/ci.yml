name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Build and package extension bundle
        run: npm run package

      - name: Upload packaged extension ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoclick-anywhere-extension
          path: release/*.zip
